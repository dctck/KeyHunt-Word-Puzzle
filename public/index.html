<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyHunt - The Word Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .font-title { font-family: 'Space+Grotesk', sans-serif; }
        .key { transition: all 0.1s ease-out; }
        .key:active { transform: scale(0.95); }
        .key.discovered {
            background-color: #06b6d4; /* cyan-500 */
            color: white;
            transform: scale(1.05);
        }
        .key.tried {
            background-color: #374151; /* gray-700 */
        }
        .tile-container {
            perspective: 1000px;
        }
        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform-style: preserve-3d;
        }
        .tile-inner.flip {
            transform: rotateX(180deg);
        }
        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem; /* text-4xl */
            font-weight: 700; /* bold */
            text-transform: uppercase;
            border-radius: 0.5rem; /* rounded-lg */
        }
        .tile-front {
            background-color: #374151; /* gray-700 */
            border: 2px solid #4b5563; /* gray-600 */
        }
        .tile-back {
            background-color: #06b6d4; /* cyan-500 */
            border: 2px solid #22d3ee; /* cyan-400 */
            transform: rotateX(180deg);
        }
        .input-tile {
             background-color: #1f2937; /* gray-800 */
             border: 2px solid #4b5563; /* gray-600 */
        }
        .input-tile.discovered {
            background-color: #06b6d4;
            border-color: #22d3ee;
        }
        .tile-inner.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .all-keys-glow { animation: glowing 2s ease-in-out infinite alternate; }
        @keyframes glowing {
            from { box-shadow: 0 0 3px #06b6d4, 0 0 6px #06b6d4, 0 0 9px #0891b2; }
            to { box-shadow: 0 0 6px #0891b2, 0 0 12px #0e7490, 0 0 18px #0e7490; }
        }
        .word-dance { animation: dance 0.8s ease-in-out; }
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0); } 20% { transform: translateY(-5px) rotate(-2deg); }
            40% { transform: translateY(0) rotate(2deg); } 60% { transform: translateY(-5px) rotate(-1deg); }
            80% { transform: translateY(0) rotate(1deg); }
        }
        .gold-text {
            background: -webkit-linear-gradient(45deg, #fde047, #facc15, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .snackbar {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s 2.5s, opacity 0.3s ease-out, transform 0.3s ease-out;
            transform: translate(-50%, -50%) scale(0.9);
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 60;
        }
        .snackbar.show {
            visibility: visible;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            transition: opacity 0.3s ease-in, transform 0.3s ease-in;
        }
        #game-container::-webkit-scrollbar { display: none; }
        #game-container { -ms-overflow-style: none; scrollbar-width: none; }
        #keyboard, #victory-footer {
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex flex-col h-screen p-2 sm:p-4">

    <!-- Header -->
    <header class="flex-shrink-0 flex items-center justify-between flex-wrap w-full max-w-2xl mx-auto p-2">
        <div class="flex items-center gap-2">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white">
                <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1 class="text-3xl sm:text-4xl font-bold font-title text-white">Key<span class="text-cyan-400">Hunt</span></h1>
        </div>
        <div class="flex items-center gap-2 sm:gap-4 mt-2 sm:mt-0">
            <div id="turns-mode-header" class="flex items-center gap-2 sm:gap-4">
                <div class="text-center">
                    <div id="target-moves-display" class="text-xl font-bold">0</div>
                    <div class="text-xs text-gray-400">TARGET</div>
                </div>
                <div class="text-center">
                    <div id="moves-display" class="text-xl font-bold">0</div>
                    <div class="text-xs text-gray-400">TURNS</div>
                </div>
            </div>
             <div id="speed-mode-header" class="hidden items-center gap-2 sm:gap-4">
                <div class="text-center">
                    <div id="timer-display" class="text-xl font-bold">0:00</div>
                    <div class="text-xs text-gray-400">TIME</div>
                </div>
                <div class="text-center">
                    <div id="speed-moves-display" class="text-xl font-bold">0</div>
                    <div class="text-xs text-gray-400">MOVES</div>
                </div>
            </div>
            <div class="relative">
                 <button id="menu-btn" class="p-2 rounded-full hover:bg-gray-700 transition">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                <div id="menu-dropdown" class="absolute right-0 mt-2 w-48 bg-gray-800 rounded-md shadow-lg z-20 hidden">
                    <button id="player-id-btn" class="w-full text-left block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700"></button>
                    <a href="#" id="today-btn" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">Today's Puzzle</a>
                    <a href="#" id="archives-btn" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">Archives</a>
                    <a href="#" id="settings-btn" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">Settings</a>
                    <a href="#" id="help-btn" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">How to Play</a>
                </div>
            </div>
        </div>
    </header>
    
    <h2 id="puzzle-title" class="text-center text-lg text-gray-400 font-semibold mb-4"></h2>

    <!-- Game Board -->
    <main id="game-container" class="flex-grow flex flex-col items-center w-full max-w-sm mx-auto overflow-y-auto pt-4 rounded-lg">
        <div id="board-content" class="w-full space-y-2">
            <!-- JS will populate this -->
        </div>
        <div id="victory-footer" class="hidden text-center mt-4">
            <h2 id="victory-message" class="text-3xl font-bold gold-text"></h2>
            <div class="flex justify-center gap-8 my-4 text-gray-300">
                <div class="text-center">
                    <div id="result-score" class="text-3xl font-bold"></div>
                    <div id="result-score-label" class="text-xs">SCORE</div>
                </div>
            </div>
            <div id="countdown-container" class="hidden mt-2 text-center">
                <p class="text-sm text-gray-400">Next puzzle in:</p>
                <div id="countdown-timer" class="text-2xl font-bold text-cyan-400"></div>
            </div>
            <div id="result-buttons" class="flex gap-2 mt-4">
                <button id="share-btn" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-md transition">Share</button>
                <button id="archives-cta-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-md transition">Archives</button>
                <button id="play-next-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-md transition">Next</button>
            </div>
        </div>
    </main>

    <!-- On-screen Keyboard -->
    <footer id="keyboard-container" class="flex-shrink-0 w-full max-w-2xl mx-auto pt-4">
        <div id="keyboard">
            <!-- Keyboard rows will be generated here -->
        </div>
    </footer>
    
    <!-- Snackbar for messages -->
    <div id="snackbar" class="snackbar bg-gray-700 text-white px-4 py-2 rounded-md shadow-lg"></div>

    <!-- Modals -->
    <div id="archives-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-75 hidden">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-cyan-400">Archives</h2>
                <button id="close-archives-btn" class="p-1 rounded-full hover:bg-gray-700 text-2xl leading-none">&times;</button>
            </div>
            <div id="archives-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
        </div>
    </div>
    <div id="help-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-75 hidden">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold text-cyan-400 mb-4">How to Play</h2>
            <div id="instructions-content" class="space-y-3 text-gray-300"></div>
            <button id="close-help-btn" class="mt-6 w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-4 rounded-md transition">Got it!</button>
        </div>
    </div>
     <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-75 hidden">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-cyan-400">Settings</h2>
                <button id="close-settings-btn" class="p-1 rounded-full hover:bg-gray-700 text-2xl leading-none">&times;</button>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-gray-300">Speed Mode</span>
                <label for="speed-mode-toggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="speed-mode-toggle" class="sr-only">
                        <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                    </div>
                </label>
            </div>
        </div>
    </div>


    <script type="module">
        const DOM = {
            gameContainer: document.getElementById('game-container'),
            boardContent: document.getElementById('board-content'),
            keyboard: document.getElementById('keyboard'),
            keyboardContainer: document.getElementById('keyboard-container'),
            victoryFooter: document.getElementById('victory-footer'),
            victoryMessage: document.getElementById('victory-message'),
            menuBtn: document.getElementById('menu-btn'),
            menuDropdown: document.getElementById('menu-dropdown'),
            archivesBtn: document.getElementById('archives-btn'),
            archivesModal: document.getElementById('archives-modal'),
            archivesList: document.getElementById('archives-list'),
            closeArchivesBtn: document.getElementById('close-archives-btn'),
            helpBtn: document.getElementById('help-btn'),
            helpModal: document.getElementById('help-modal'),
            instructionsContent: document.getElementById('instructions-content'),
            closeHelpBtn: document.getElementById('close-help-btn'),
            settingsBtn: document.getElementById('settings-btn'),
            settingsModal: document.getElementById('settings-modal'),
            closeSettingsBtn: document.getElementById('close-settings-btn'),
            speedModeToggle: document.getElementById('speed-mode-toggle'),
            countdownContainer: document.getElementById('countdown-container'),
            countdownTimer: document.getElementById('countdown-timer'),
            archivesCtaBtn: document.getElementById('archives-cta-btn'),
            shareBtn: document.getElementById('share-btn'),
            playNextBtn: document.getElementById('play-next-btn'),
            snackbar: document.getElementById('snackbar'),
            movesDisplay: document.getElementById('moves-display'),
            speedMovesDisplay: document.getElementById('speed-moves-display'),
            puzzleTitle: document.getElementById('puzzle-title'),
            targetMovesDisplay: document.getElementById('target-moves-display'),
            turnsModeHeader: document.getElementById('turns-mode-header'),
            speedModeHeader: document.getElementById('speed-mode-header'),
            resultScore: document.getElementById('result-score'),
            resultScoreLabel: document.getElementById('result-score-label'),
            playerIdBtn: document.getElementById('player-id-btn'),
            todayBtn: document.getElementById('today-btn'),
            timerDisplay: document.getElementById('timer-display'),
        };

        let state = {};

        function setupGame(puzzle) {
            state = {
                puzzle,
                currentWord: puzzle.startWord,
                inputWord: "",
                history: [],
                triedLetters: new Set(),
                discoveredKeys: new Set(),
                isChecking: false,
                gameOver: false,
                allKeysFound: false,
                moves: 0,
                countdownInterval: null,
                shareGrid: "",
                isToday: false,
                gameMode: localStorage.getItem('keyhunt-mode') || 'turns',
            };
            if(state.gameMode === 'turns'){
                state.totalTurns = puzzle.targetMoves + 4;
            }
        }

        function render() {
            renderBoard();
            renderKeyboard();
            renderInstructions();
            renderHeader();
            DOM.puzzleTitle.textContent = state.isToday 
                ? `Daily Puzzle #${state.puzzle.puzzleNumber}` 
                : `Archive #${state.puzzle.puzzleNumber}`;
        }
        
        function renderHeader() {
            if (state.gameMode === 'speed') {
                DOM.turnsModeHeader.classList.add('hidden');
                DOM.speedModeHeader.classList.remove('hidden');
                DOM.speedMovesDisplay.textContent = state.moves;
            } else {
                DOM.turnsModeHeader.classList.remove('hidden');
                DOM.speedModeHeader.classList.add('hidden');
                DOM.movesDisplay.textContent = state.moves;
                DOM.targetMovesDisplay.textContent = state.puzzle.targetMoves;
            }
        }

        function renderBoard() {
            const historyHtml = state.history.map(word => createTileRow(word, false)).join('');
            const currentHtml = createTileRow(state.currentWord, false);
            const inputHtml = state.gameOver ? '' : createTileRow(state.inputWord, true);
            
            DOM.boardContent.innerHTML = historyHtml + currentHtml + inputHtml;
            
            DOM.gameContainer.scrollTop = DOM.gameContainer.scrollHeight;
        }

        function createTileRow(word, isInput) {
            const wordArr = word.padEnd(state.puzzle.startWord.length, ' ').split('');
            const tilesHtml = wordArr.map((letter, i) => {
                const content = letter.trim();
                const isKey = state.puzzle.endWord.includes(content);
                const isDiscovered = isKey && state.discoveredKeys.has(content);

                if (isInput) {
                    const tileClasses = isDiscovered ? 'input-tile discovered' : 'input-tile';
                    return `<div class="w-full aspect-square rounded-lg flex items-center justify-center text-4xl font-bold uppercase ${tileClasses}">${content}</div>`;
                }
                
                const flipClass = isDiscovered ? 'flip' : '';
                return `
                    <div class="tile-container w-full aspect-square">
                        <div class="tile-inner ${flipClass}" data-is-key="${isKey}">
                            <div class="tile-face tile-front">${content}</div>
                            <div class="tile-face tile-back">${content}</div>
                        </div>
                    </div>
                `;
            }).join('');
            return `<div class="grid grid-cols-${state.puzzle.startWord.length} gap-2">${tilesHtml}</div>`;
        }
        
        function renderInstructions() {
            DOM.instructionsContent.innerHTML = `
                <p>1. Change the <strong>START</strong> word to the <strong>FINAL</strong> word.</p>
                <p>2. Submit a new word by changing just <strong>one letter</strong>. The other letters can be rearranged.</p>
                <p>3. Discover the hidden <strong>Keys</strong> (the letters of the final word) by using them in your words.</p>
                <p>4. Once all keys are found, make the final word to win!</p>
            `;
        }

        function renderKeyboard() {
            const keysLayout = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                ['SUBMIT', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DELETE']
            ];
            DOM.keyboard.innerHTML = keysLayout.map(row => {
                const rowHtml = row.map(key => {
                    const isDiscovered = state.discoveredKeys.has(key);
                    const isTried = state.triedLetters.has(key);
                    const baseClass = 'key h-12 rounded-md font-bold ';
                    let stateClass = 'bg-gray-500 hover:bg-gray-600';
                    if (isDiscovered) {
                        stateClass = 'discovered';
                    } else if (isTried) {
                        stateClass = 'tried';
                    }

                    if (key === 'SUBMIT') return `<button data-key="SUBMIT" class="${baseClass} bg-green-600 hover:bg-green-700 text-white px-2 text-xs" style="width: 64px;">SUBMIT</button>`;
                    if (key === 'DELETE') return `<button data-key="DELETE" class="${baseClass} bg-gray-600 hover:bg-gray-700 px-2 flex items-center justify-center" style="width: 64px;"><svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m22 6c0-.552-.448-1-1-1h-12.628c-.437 0-.853.191-1.138.523-1.078 1.256-3.811 4.439-4.993 5.815-.16.187-.241.419-.241.651 0 .231.08.463.24.651 1.181 1.38 3.915 4.575 4.994 5.835.285.333.701.525 1.14.525h12.626c.552 0 1-.448 1-1 0-2.577 0-9.423 0-12zm-13.628.5h12.128v11h-12.126l-4.715-5.51zm5.637 4.427 1.71-1.71c.146-.146.339-.219.531-.219.404 0 .75.324.75.749 0 .193-.073.384-.219.531l-1.711 1.711 1.728 1.728c.147.147.22.339.22.53 0 .427-.349.751-.75.751-.192 0-.384-.073-.531-.219l-1.728-1.729-1.728 1.729c-.146.146-.339-.219-.531-.219-.401 0-.75-.324-.75-.751 0-.191.073-.383.22-.53l1.728-1.728-1.788-1.787c-.146-.148-.219-.339-.219-.532 0-.425.346-.749.751-.749.192 0 .384.073.53.219z" fill-rule="nonzero"/></svg></button>`;
                    return `<button data-key="${key}" class="${baseClass} flex-1 ${stateClass}">${key}</button>`;
                }).join('');
                
                return `<div class="flex justify-center w-full gap-1 sm:gap-2 my-1">${rowHtml}</div>`;
            }).join('');
        }
        
        async function isValidWord(word) {
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                return response.ok;
            } catch (error) {
                showSnackbar("Network error. Please try again.");
                return false;
            }
        }

        function checkWordChangeRule(current, next) {
            const currentSet = current.split('');
            const nextSet = next.split('');
            let common = 0;
            for (const letter of nextSet) {
                const index = currentSet.indexOf(letter);
                if (index > -1) {
                    currentSet.splice(index, 1);
                    common++;
                }
            }
            return common === current.length - 1;
        }
        
        function showSnackbar(message) {
            DOM.snackbar.textContent = message;
            DOM.snackbar.classList.add('show');
            setTimeout(() => {
                DOM.snackbar.classList.remove('show');
            }, 2500);
        }

        function generateShareGrid() {
            const fullPath = [...state.history, state.currentWord];
            const keysInEndWord = new Set(state.puzzle.endWord.split(''));
            const discoveredForGrid = new Set();
            const grid = [];

            for (const word of fullPath) {
                let line = '';
                const newKeysThisTurn = new Set();
                for (const letter of word) {
                    if (keysInEndWord.has(letter)) {
                        if (!discoveredForGrid.has(letter)) {
                            line += '🌟';
                            newKeysThisTurn.add(letter);
                        } else {
                            line += '🟦';
                        }
                    } else {
                        line += '⬛️';
                    }
                }
                grid.push(line);
                newKeysThisTurn.forEach(k => discoveredForGrid.add(k));
            }
            return grid.join('\n');
        }
        
        function startNextPuzzleCountdown() {
            if (state.countdownInterval) clearInterval(state.countdownInterval);

            function updateCountdown() {
                const now = new Date();
                const tomorrow = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(0, 0, 0, 0);

                const diff = tomorrow - new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));

                const h = Math.floor(diff / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                DOM.countdownTimer.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            
            updateCountdown();
            state.countdownInterval = setInterval(updateCountdown, 1000);
        }

        function showEndState(isWin, message) {
            state.gameOver = true;
            
            const finalWordRow = DOM.boardContent.lastElementChild.previousElementSibling;
            if(finalWordRow) finalWordRow.classList.add('word-dance');
            
            DOM.keyboardContainer.style.opacity = '0';
            DOM.victoryFooter.classList.remove('hidden');
            
            setTimeout(() => {
                DOM.keyboardContainer.style.display = 'none';
                DOM.victoryFooter.style.opacity = '1';
            }, 500);

            if(isWin) {
                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 }, angle: 90, startVelocity: 40 });
                DOM.victoryMessage.textContent = message;
                DOM.victoryMessage.classList.remove('text-red-400');
                DOM.victoryMessage.classList.add('gold-text');
            } else {
                 DOM.victoryMessage.textContent = "Game Over";
                 DOM.victoryMessage.classList.add('text-red-400');
                 DOM.victoryMessage.classList.remove('gold-text');
            }

            if (state.isToday) {
                DOM.countdownContainer.classList.remove('hidden');
                DOM.playNextBtn.style.display = 'none';
                startNextPuzzleCountdown();
            } else {
                DOM.countdownContainer.classList.add('hidden');
                if (state.puzzle.puzzleNumber < 4) { // Assuming 4 puzzles total
                    DOM.playNextBtn.style.display = 'block';
                } else {
                    DOM.playNextBtn.style.display = 'none';
                }
            }
        }

        async function handleSubmit() {
            if (state.isChecking || state.gameOver) return;
            if (state.inputWord.length !== state.puzzle.startWord.length) {
                showSnackbar("Word must be 4 letters long.");
                const inputRow = DOM.boardContent.lastElementChild;
                inputRow.classList.add('shake');
                setTimeout(() => inputRow.classList.remove('shake'), 500);
                return;
            }

            const nextWord = state.inputWord;
            if (state.history.includes(nextWord) || state.currentWord === nextWord) {
                showSnackbar("Word already used.");
                return;
            }
            if (!checkWordChangeRule(state.currentWord, nextWord)) {
                showSnackbar("You can only change one letter.");
                return;
            }

            state.isChecking = true;
            const isRealWord = await isValidWord(nextWord);
            state.isChecking = false;

            if (!isRealWord) {
                showSnackbar("Not a valid word.");
                return;
            }

            state.moves++;
            
            nextWord.split('').forEach(letter => state.triedLetters.add(letter));
            
            const isWinningAnagram = nextWord.split('').sort().join('') === state.puzzle.endWord.split('').sort().join('');
            
            state.history.push(state.currentWord);
            state.currentWord = nextWord;
            state.inputWord = "";
            
            if (isWinningAnagram) {
                state.puzzle.endWord.split('').forEach(k => state.discoveredKeys.add(k));
                render();
                showEndState(true, `You solved puzzle #${state.puzzle.puzzleNumber} in ${state.moves} moves!`);
                return;
            }
            
            const newKeys = nextWord.split('').filter(letter => state.puzzle.endWord.includes(letter) && !state.discoveredKeys.has(letter));
            
            if (newKeys.length > 0) {
                newKeys.forEach(key => state.discoveredKeys.add(key));
            }

            render();
            renderKeyboard();
            
            const currentWordRow = DOM.boardContent.children[state.history.length];
            if (currentWordRow) {
                const lettersInWord = state.currentWord.split('');
                Array.from(currentWordRow.children).forEach((tileContainer, i) => {
                    const tileInner = tileContainer.querySelector('.tile-inner');
                    if (tileInner && state.discoveredKeys.has(lettersInWord[i])) {
                        setTimeout(() => {
                            tileInner.classList.add('flip');
                        }, i * 100);
                    }
                });
            }

            if (!state.allKeysFound && state.discoveredKeys.size === state.puzzle.endWord.length) {
                state.allKeysFound = true;
                showSnackbar("All keys found! Now form the final word.");
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#06b6d4', '#22d3ee', '#67e8f9'] });
                DOM.gameContainer.classList.add('all-keys-glow');
            }
            
            if (state.gameMode === 'turns' && state.moves >= state.totalTurns) {
                showEndState(false);
            }
        }

        function handleVirtualKeyboard(key) {
             if (state.gameOver) return;
            if (!key) return;
            if (key === 'SUBMIT') {
                handleSubmit();
            } else if (key === 'DELETE') {
                state.inputWord = state.inputWord.slice(0, -1);
            } else if (state.inputWord.length < state.puzzle.startWord.length) {
                state.inputWord += key;
            }
            renderBoard();
        }

        function handlePhysicalKeyboard(e) {
            if (state.gameOver || DOM.helpModal.classList.contains('hidden') === false) return;
            if (e.key.match(/^[a-zA-Z]$/)) {
                handleVirtualKeyboard(e.key.toUpperCase());
            } else if (e.key === 'Enter') {
                handleVirtualKeyboard('SUBMIT');
            } else if (e.key === 'Backspace') {
                handleVirtualKeyboard('DELETE');
            }
        }
        
        async function initGame(dateString) {
            try {
                const url = dateString ? `/api/puzzle?date=${dateString}` : '/api/puzzle';
                const response = await fetch(url);
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Could not load puzzle.');
                }
                const puzzle = await response.json();
                if (state.timerInterval) clearInterval(state.timerInterval);
                setupGame(puzzle);

                const todayStr = new Date().toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
                state.isToday = puzzle.date === todayStr;
                
                render();
                DOM.victoryFooter.classList.add('hidden');
                DOM.keyboardContainer.style.opacity = '1';
                DOM.keyboardContainer.style.display = 'block';
                DOM.gameContainer.classList.remove('all-keys-glow');
            } catch (error) {
                showSnackbar(error.message);
            }
        }

        function handleShare() {
            const shareText = `KeyHunt #${state.puzzle.puzzleNumber}\nSolved in ${state.moves} moves\n\n${state.shareGrid}`;
            const textarea = document.createElement('textarea');
            textarea.value = shareText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showSnackbar('Copied to clipboard!');
            } catch (err) {
                showSnackbar('Failed to copy!');
            }
            document.body.removeChild(textarea);
        }
        
        async function showArchives() {
            try {
                const response = await fetch('/api/archives');
                const puzzles = await response.json();
                DOM.archivesList.innerHTML = puzzles.map(p => 
                    `<button data-date="${p.date}" class="archive-date-btn block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 rounded-md">#${p.puzzleNumber} - ${p.date}</button>`
                ).join('');
                DOM.archivesModal.classList.remove('hidden');
            } catch (error) {
                showSnackbar("Could not load archives.");
            }
        }

        DOM.keyboard.addEventListener('click', (e) => handleVirtualKeyboard(e.target.closest('.key')?.dataset.key));
        document.addEventListener('keydown', handlePhysicalKeyboard);
        DOM.helpBtn.addEventListener('click', () => DOM.helpModal.classList.remove('hidden'));
        DOM.closeHelpBtn.addEventListener('click', () => DOM.helpModal.classList.add('hidden'));
        DOM.menuBtn.addEventListener('click', () => DOM.menuDropdown.classList.toggle('hidden'));
        DOM.todayBtn.addEventListener('click', (e) => {
            e.preventDefault();
            initGame();
            DOM.menuDropdown.classList.add('hidden');
        });
        DOM.archivesBtn.addEventListener('click', (e) => {
            e.preventDefault();
            showArchives();
            DOM.menuDropdown.classList.add('hidden');
        });
        DOM.closeArchivesBtn.addEventListener('click', () => DOM.archivesModal.classList.add('hidden'));
        DOM.archivesList.addEventListener('click', (e) => {
            if (e.target.matches('.archive-date-btn')) {
                const date = e.target.dataset.date;
                initGame(date);
                DOM.archivesModal.classList.add('hidden');
            }
        });
        DOM.archivesCtaBtn.addEventListener('click', () => {
             showArchives();
        });
        DOM.shareBtn.addEventListener('click', handleShare);
        DOM.playNextBtn.addEventListener('click', async () => {
            const response = await fetch('/api/archives');
            const puzzles = await response.json();
            const currentIndex = puzzles.findIndex(p => p.date === state.puzzle.date);
            if (currentIndex > 0) {
                initGame(puzzles[currentIndex - 1].date);
            }
        });
        
        // Close dropdown if clicking outside
        document.addEventListener('click', (e) => {
            if (!DOM.menuBtn.contains(e.target) && !DOM.menuDropdown.contains(e.target)) {
                DOM.menuDropdown.classList.add('hidden');
            }
        });
        
        initGame(); // Load today's puzzle on start
    </script>
</body>
</html>
