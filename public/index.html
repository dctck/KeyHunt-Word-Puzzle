        function updateInputRow() {
            const inputRow = DOM.boardContent.lastElementChild;
            if (inputRow && !state.gameOver) {
                const wordArr = state.inputWord.padEnd(state.puzzle.startWord.length, ' ').split('');
                const tiles = inputRow.children;
                
                wordArr.forEach((letter, i) => {
                    if (tiles[i]) {
                        const content = letter.trim();
                        const isKey = state.puzzle.endWord.includes(content);
                        const isDiscovered = isKey && state.discoveredKeys.has(content);
                        
                        tiles[i].textContent = content;
                        const allKeysClass = state.allKeysFound ? ' all-keys-found' : '';
                        const tileClasses = isDiscovered ? `input-tile discovered${allKeysClass}` : `input-tile${allKeysClass}`;

                        tiles[i].className = `w-full aspect-square flex items-center justify-center text-4xl uppercase ${tileClasses}`;
                    }
                });
            }
        }

        function handleVirtualKeyboard(key) {
            
            if (state.moves > 0 && !state.gameOver) {
                mainWrapperBox.scrollTop = mainWrapperBox.scrollHeight;
            }
            if (state.gameOver) return;
            if (!key) return;
            if (key === 'SUBMIT') {
                handleSubmit();
            } else if (key === 'DELETE') {
                state.inputWord = state.inputWord.slice(0, -1);
                updateInputRow();
            } else if (state.inputWord.length < state.puzzle.startWord.length) {
                state.inputWord += key;
                updateInputRow();
            }
        }

        function handlePhysicalKeyboard(e) {

            if (e.key.match(/^[a-zA-Z]$/) && tutorial.active && !DOM.modal.classList.contains('hidden')) {
                const step = tutorial.steps[tutorial.step];
                if (step?.action === 'submit') {
                    closeModal(); // Dismiss modal first
                    handleVirtualKeyboard(e.key.toUpperCase()); // Then process the letter
                    return;
                }
            }

            if (e.key === 'Enter' && isTutorialContinueStep()) {
                nextTutorialStep();
                return;
            }
            
            if (state.moves > 0 && !state.gameOver) {
                mainWrapperBox.scrollTop = mainWrapperBox.scrollHeight;
            }
            if (state.gameOver || !DOM.modal.classList.contains('hidden')) return;
            if (e.key.match(/^[a-zA-Z]$/)) {
                handleVirtualKeyboard(e.key.toUpperCase());
            } else if (e.key === 'Enter') {
                handleVirtualKeyboard('SUBMIT');
            } else if (e.key === 'Backspace') {
                handleVirtualKeyboard('DELETE');
            }
        }
        
        async function initGame(dateString, forceRestart = false, puzzleNumber = null) {
            
            try {
                const url = dateString ? `/api/puzzle?date=${dateString}` : '/api/puzzle';
                
                const response = await fetch(url);
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Could not load puzzle.');
                }
                
                const puzzle = await response.json();
                
                // Deobfuscate once, right after getting from API
                if (!puzzle.endWord.match(/^[A-Z]{4}$/)) {
                    puzzle.endWord = deobfuscateAnswer(puzzle.endWord, puzzle.puzzleNumber, puzzle.startWord);
                }
                
                const todayStr = new Date().toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
                const isToday = puzzle.date === todayStr;
                const savedScores = getSavedScores();
                const isCompleted = savedScores[puzzle.puzzleNumber] !== undefined;
                
                
                if (isCompleted) {
                    setupGame(puzzle, {
                        isToday,
                        gameState: 'completed'
                    });
                } else {
                    setupGame(puzzle, {
                        isToday,
                        gameState: 'fresh'
                    });
                }
                
            } catch (error) {
                showSnackbar(error.message);
            }
        }

        async function generateProgressCode() {
            try {
                const turnsScores = JSON.parse(localStorage.getItem('keyhunt-scores-turns') || '{}');
                const speedScores = JSON.parse(localStorage.getItem('keyhunt-scores-speed') || '{}');
                const turnsStats = JSON.parse(localStorage.getItem('keyhunt-daily-stats-turns') || '{}');
                const speedStats = JSON.parse(localStorage.getItem('keyhunt-daily-stats-speed') || '{}');
                const playerId = localStorage.getItem('keyhunt-playerId');
                
                // Only export today's puzzle history if it exists and is completed
                let todayHistory = {};
                
                try {
                    const response = await fetch('/api/puzzle');
                    if (!response.ok) {
                        throw new Error(`API response not ok: ${response.status}`);
                    }
                    const todayPuzzle = await response.json();
                    
                    const todayStr = new Date().toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
                    
                    if (todayPuzzle && todayPuzzle.date === todayStr) {
                        const turnsHistory = JSON.parse(localStorage.getItem('keyhunt-history-turns') || '{}');
                        const speedHistory = JSON.parse(localStorage.getItem('keyhunt-history-speed') || '{}');
                        
                        // Only include today's history if puzzle is completed
                        if (turnsHistory[todayPuzzle.puzzleNumber]) {
                            todayHistory.turns = { [todayPuzzle.puzzleNumber]: turnsHistory[todayPuzzle.puzzleNumber] };
                        }
                        if (Object.keys(speedHistory).length > 0) {
                            todayHistory.speed = speedHistory; // Export all speed history (includes mode suffixes)
                        }
                    }
                } catch (fetchError) {
                    console.warn('Could not fetch today\'s puzzle for export:', fetchError);
                }

                const exportData = {
                    version: 3,
                    scores: {
                        turns: turnsScores,
                        speed: speedScores
                    },
                    stats: {
                        turns: turnsStats,
                        speed: speedStats
                    },
                    todayHistory: todayHistory,
                    playerId: playerId,
                    exportDate: new Date().toISOString()
                };
                
                const jsonString = JSON.stringify(exportData);
                
                // Fix for Unicode characters - encode to UTF-8 first, then base64
                const utf8Bytes = new TextEncoder().encode(jsonString);
                const binaryString = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join('');
                const compressed = btoa(binaryString);
                
                return 'KH_v3_' + compressed;
                
            } catch (error) {
                console.error('Export failed:', error);
                throw error;
            }
        }

        function importProgressCode(codeString) {
            if (!codeString.startsWith('KH_v1_') && !codeString.startsWith('KH_v2_')) {
                throw new Error('Invalid progress code format');
            }
            
            try {
                const isV2 = codeString.startsWith('KH_v2_');
                const isV3 = codeString.startsWith('KH_v3_');
                const encoded = codeString.replace(/^KH_v[123]_/, '');
                
                let decoded;
                if (isV2 || isV3) {
                    const binaryString = atob(encoded);
                    const utf8Bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        utf8Bytes[i] = binaryString.charCodeAt(i);
                    }
                    decoded = new TextDecoder().decode(utf8Bytes);
                } else {
                    // V1 format - legacy decoding
                    decoded = atob(encoded);
                }
            
                const importData = JSON.parse(decoded);

                if (isV3) {
                    // V3 import logic - handles nested speed scores
                    if (importData.scores?.turns) {
                        localStorage.setItem('keyhunt-scores-turns', JSON.stringify(importData.scores.turns));
                    }
                    if (importData.scores?.speed) {
                        // V3 speed scores are in nested format: { "1": { "t": "2:34", "u": "1:45" } }
                        localStorage.setItem('keyhunt-scores-speed', JSON.stringify(importData.scores.speed));
                    }
                    if (importData.stats?.turns) {
                        localStorage.setItem('keyhunt-daily-stats-turns', JSON.stringify(importData.stats.turns));
                    }
                    if (importData.stats?.speed) {
                        localStorage.setItem('keyhunt-daily-stats-speed', JSON.stringify(importData.stats.speed));
                    }
                    if (importData.todayHistory?.turns) {
                        localStorage.setItem('keyhunt-history-turns', JSON.stringify(importData.todayHistory.turns));
                    }
                    if (importData.todayHistory?.speed) {
                        // V3 speed history uses nested keys: { "1_t": {...}, "1_u": {...} }
                        localStorage.setItem('keyhunt-history-speed', JSON.stringify(importData.todayHistory.speed));
                    }
                    if (importData.playerId) {
                        localStorage.setItem('keyhunt-playerId', importData.playerId);
                    }
                } else if (isV2) {
                    // V2 import logic (same as before)
                    if (importData.scores?.turns) {
                        localStorage.setItem('keyhunt-scores-turns', JSON.stringify(importData.scores.turns));
                    }
                    if (importData.scores?.speed) {
                        localStorage.setItem('keyhunt-scores-speed', JSON.stringify(importData.scores.speed));
                    }
                    if (importData.stats?.turns) {
                        localStorage.setItem('keyhunt-daily-stats-turns', JSON.stringify(importData.stats.turns));
                    }
                    if (importData.stats?.speed) {
                        localStorage.setItem('keyhunt-daily-stats-speed', JSON.stringify(importData.stats.speed));
                    }
                    if (importData.todayHistory?.turns) {
                        localStorage.setItem('keyhunt-history-turns', JSON.stringify(importData.todayHistory.turns));
                    }
                    if (importData.todayHistory?.speed) {
                        localStorage.setItem('keyhunt-history-speed', JSON.stringify(importData.todayHistory.speed));
                    }
                    if (importData.playerId) {
                        localStorage.setItem('keyhunt-playerId', importData.playerId);
                    }
                } else {
                    
                }
                
                return true;
                
            } catch (error) {
                throw new Error('Invalid progress code format');
            }
        }

            // Set initial selection
            const currentGameMode = localStorage.getItem('keyhunt-mode') || 'turns';
            const currentTimedMode = localStorage.getItem('keyhunt-timed-mode') === 'true';
            
            let currentMode = 'turns';
            if (currentGameMode === 'unlimited') {
                currentMode = 'unlimited';
            } else if (currentTimedMode) {
                currentMode = 'timed';
            }
            
            // Clear all selections first
            modeOptions.forEach(opt => opt.classList.remove('selected'));
            
            // Set initial selection
            document.querySelector(`[data-mode="${currentMode}"]`)?.classList.add('selected');
            
            // Add click listeners
            modeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    if (state.moves > 0 && !state.gameOver) {
                        showConfirmationModal(
                            'Switch Mode?',
                            'Your progress on this puzzle will be lost.',
                            () => {
                                switchToMode(this, modeOptions);
                            }
                        );
                        return;
                    }
                    
                    switchToMode(this, modeOptions);
                });
            });
        }

        function switchToMode(selectedOption, allOptions) {
            allOptions.forEach(opt => opt.classList.remove('selected'));
            selectedOption.classList.add('selected');
            
            const selectedMode = selectedOption.dataset.mode;
            
            if (selectedMode === 'turns') {
                localStorage.setItem('keyhunt-mode', 'turns');
                localStorage.setItem('keyhunt-timed-mode', 'false');
                // Update current state
                state.gameMode = 'turns';
                state.isTimedMode = false;
            } else if (selectedMode === 'timed') {
                localStorage.setItem('keyhunt-mode', 'turns');
                localStorage.setItem('keyhunt-timed-mode', 'true');
                // Update current state
                state.gameMode = 'turns';
                state.isTimedMode = true;
            } else if (selectedMode === 'unlimited') {
                localStorage.setItem('keyhunt-mode', 'unlimited');
                localStorage.setItem('keyhunt-timed-mode', 'false');
                // Update current state
                state.gameMode = 'unlimited';
                state.isTimedMode = false;
            }
            
            // Re-render the header to show/hide timer
            renderHeader();
            
            // If switching to timed mode mid-game, start the timer
            if (state.isTimedMode && state.moves > 0 && !state.startTime) {
                state.startTime = new Date();
                state.timerInterval = setInterval(updateTimer, 1000);
            }
            
            // If switching away from timed mode, clear the timer
            if (!state.isTimedMode && state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        DOM.cancelConfirmationBtn.addEventListener('click', () => closeModal(DOM.confirmationModal));

        window.handleArchivesClick = async function () {
            DOM.menuDropdown.classList.add('hidden');
                showLoader();
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();

                try {
                    const response = await fetch('/api/archives');
                    const puzzles = await response.json();
                    
                    // Get today's puzzle number to filter archives
                    const todayResponse = await fetch('/api/puzzle');
                    const todayPuzzle = await todayResponse.json();
                    const todayPuzzleNumber = todayPuzzle.puzzleNumber;
                    
                    // Filter to show only puzzles with numbers smaller than today's
                    const archivePuzzles = puzzles.filter(p => p.puzzleNumber < todayPuzzleNumber);

                    // Function to determine score type and format display
                    function formatArchiveScore(puzzleNumber) {
                        const turnsScores = JSON.parse(localStorage.getItem('keyhunt-scores-turns') || '{}');
                        const speedScores = JSON.parse(localStorage.getItem('keyhunt-scores-speed') || '{}');
                        
                        const turnsScore = turnsScores[puzzleNumber];
                        const speedScore = speedScores[puzzleNumber];
                        
                        // Determine which score to show (prioritize timed, then turns, then show 'New')
                        if (speedScore) {
                            // Timed mode - show both score and time
                            if (typeof speedScore === 'object') {
                                // V3 format: { "t": "2:34", "u": "1:45" }
                                const timedScore = speedScore.t || speedScore.u;
                                const baseScore = turnsScore ? turnsScore.replace(/\d+$/, '') : '⛳️';
                                return {
                                    type: 'timed',
                                    topLine: baseScore,
                                    bottomLine: `in ${timedScore}`
                                };
                            } else if (typeof speedScore === 'string' && speedScore.includes(':')) {
                                // V2 format: "2:34"
                                const baseScore = turnsScore ? turnsScore.replace(/\d+$/, '') : '⛳️';
                                return {
                                    type: 'timed',
                                    topLine: baseScore,
                                    bottomLine: `in ${speedScore}`
                                };
                            }
                        }
                        
                        if (turnsScore) {
                            // Check if unlimited mode (has number at end)
                            const match = turnsScore.match(/^(★★★|★★☆|★☆☆|⛳️|💤)(\d+)$/);
                            if (match) {
                                const [, stars, turns] = match;
                                return {
                                    type: 'unlimited',
                                    topLine: stars,
                                    bottomLine: `in ${turns}`
                                };
                            } else {
                                // Regular turn mode
                                return {
                                    type: 'turns',
                                    topLine: turnsScore,
                                    bottomLine: ''
                                };
                            }
                        }
                        
                        // Not played
                        return {
                            type: 'new',
                            topLine: 'New',
                            bottomLine: ''
                        };
                    }

                    const content = `
                        <div class="space-y-3 max-h-64 overflow-y-auto">
                            ${archivePuzzles.map(p => {
                                const scoreInfo = formatArchiveScore(p.puzzleNumber);
                                
                                // Convert YYYY-MM-DD to MM/DD/YY format
                                const dateParts = p.date.split('-');
                                const shortYear = dateParts[0].substring(2);
                                const shortDate = `${dateParts[1]}/${dateParts[2]}/${shortYear}`;
                                
                                return `
                                    <button data-date="${p.date}" class="archive-date-btn block w-full text-left px-4 py-3 text-sm text-gray-300 hover:bg-gray-700 transition-colors border-2 border-gray-600 mb-2 bg-gray-800" style="box-shadow: inset 0 0 0 2px #000;">
                                        <div class="flex justify-between items-center" style="pointer-events: none;">
                                            <!-- Left side: Puzzle info -->
                                            <div class="flex flex-col" style="pointer-events: none;">
                                                <div class=" text-white" style="pointer-events: none;">#${p.puzzleNumber}</div>
                                                <div class="text-xs text-gray-400" style="pointer-events: none;">${shortDate}</div>
                                            </div>
                                            
                                            <!-- Right side: Score info -->
                                            <div class="flex flex-col items-end text-right" style="pointer-events: none;">
                                                <div class="${scoreInfo.type === 'new' ? 'text-cyan-400' : 'text-white'}" style="pointer-events: none;">${scoreInfo.topLine}</div>
                                                ${scoreInfo.bottomLine ? `<div class="text-xs text-gray-400" style="pointer-events: none;">${scoreInfo.bottomLine}</div>` : '<div class="text-xs" style="pointer-events: none;">&nbsp;</div>'}
                                            </div>
                                        </div>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    `;

                    openModal('Past Puzzles', content);
                } catch (error) {
                    openModal('Archives', '<p class="text-gray-300">Could not load archives.</p>');
                }
            }

        DOM.archivesCtaBtn.addEventListener('click', handleArchivesClick);
        DOM.archivesBtn.addEventListener('click', handleArchivesClick);

        DOM.modalContent.addEventListener('click', async (e) => {

           // Star rating
           if (e.target.dataset.rating) {
               const rating = +e.target.dataset.rating;
               const stars = document.querySelectorAll('#stars button');
               stars.forEach((s, i) => {
                       if (i < rating) {
                           s.textContent = '★';
                           s.style.color = '#fbbf24';
                           s.setAttribute('data-selected', 'true'); 
                       } else {
                           s.textContent = '☆';
                           s.style.color = '#6b7280';
                           s.removeAttribute('data-selected'); 
                       }
                   });
               const ratingLabels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
               document.getElementById('rating-text').textContent = ratingLabels[rating] || 'Click to rate';

               const starsContainer = document.getElementById('stars');
               starsContainer.setAttribute('data-current-rating', rating);
           }
           
           // Send feedback
           if (e.target.id === 'send-feedback') {
               const message = document.getElementById('feedback-message').value.trim();
               if (!message) return showSnackbar('Please enter a message');
               
               const feedbackType = document.getElementById('feedback-type').value;
               const starsContainer = document.getElementById('stars');
               const rating = starsContainer ? starsContainer.getAttribute('data-current-rating') : null;

               const typeMap = {
                       'bug': 'Bug Report',
                       'feature': 'Feature Request', 
                       'general': 'General Feedback',
                       'praise': 'Compliment',
                       'difficulty': 'Puzzle Difficulty'
               };
               
               // Submit to Google Form (replace YOUR_FORM_ID with actual form ID)
               const formData = new FormData();
               formData.append('entry.873680804', typeMap[feedbackType] || 'General Feedback');  // Use mapped value!
               formData.append('entry.746742452', message);       
               formData.append('entry.1364770418', rating || ''); // Send empty string instead of '0'
               formData.append('entry.1029212732', state.puzzle?.puzzleNumber || 0);
               formData.append('entry.1198672043', new Date().toISOString());
               formData.append('entry.1223482797', localStorage.getItem('keyhunt-playerId') || 'unknown');

               console.log('Sending to Google Form:', {
                   type: typeMap[feedbackType],
                   message: message,
                   rating: rating || 'no rating',
                   puzzle: state.puzzle?.puzzleNumber || 0
               });
               
               // Submit to Google Form
               fetch('https://docs.google.com/forms/d/e/1FAIpQLSfDhfl8cLZp5ZEv30uxTMDu-PQl2cwJw7ZmaLHRkB7q3049fA/formResponse', {
                   method: 'POST',
                   mode: 'no-cors',
                   body: formData
               }).then(() => {
               }).catch(err => {
               });
               
               // Also send to GA for backup
               if (typeof trackEvent === 'function') {
                    trackEvent('feedback_submitted', {
                        feedback_type: feedbackType,
                        rating: rating || '0'
                    });
                }
               
               showSnackbar('Thank you! Feedback sent 🎉');
               closeModal();
           }

            // Handle archive puzzle clicks
            if (e.target.matches('.archive-date-btn')) {
                const date = e.target.dataset.date;
                transitionToPuzzle(date);
                closeModal();
            }

            if (e.target.id === 'copy-player-id') {
                    const playerId = localStorage.getItem('keyhunt-playerId');
                    const textarea = document.createElement('textarea');
                    textarea.value = playerId;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showSnackbar('Player ID copied to clipboard!');
                        e.target.textContent = 'Copied!';
                        setTimeout(() => {
                            e.target.textContent = 'Copy';
                        }, 2000);
                    } catch (err) {
                        showSnackbar('Failed to copy Player ID!');
                    }
                    document.body.removeChild(textarea);
                }

            // Handle export button
            if (e.target.matches('#export-code-btn')) {
                try {
                    const code = await generateProgressCode();
                    navigator.clipboard.writeText(code).then(() => {
                        showSnackbar('Complete progress exported to clipboard!');
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = code;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        showSnackbar('Complete progress exported!');
                    });
                } catch (error) {
                    console.error('Export error:', error);
                    showSnackbar('Export failed. Please try again.');
                }
            }
            
            // Handle import button with enhanced feedback
            if (e.target.matches('#import-code-btn')) {
                const code = document.getElementById('import-code-input').value.trim();
                if (!code) {
                    showSnackbar('Please enter a progress code');
                    return;
                }
                
                try {
                    importProgressCode(code);
                    showSnackbar('Progress imported successfully! Reloading...');
                    document.getElementById('import-code-input').value = '';
                    
                    // Give user time to see the success message before reloading
                    setTimeout(() => {
                        closeModal();
                        if (state.puzzle) {
                            const currentDate = state.puzzle.date;
                            initGame(currentDate);
                        } else {
                            location.reload();
                        }
                    }, 1500);
                    
                } catch (error) {
                    console.error('Import error:', error);
                    showSnackbar('Invalid or corrupted progress code');
                }
            }
        
            // Handle clear data button
            if (e.target.matches('#clear-data-btn')) {
                closeModal();
                showConfirmationModal(
                    'Clear All Data?',
                    'This will reset all your scores, history, and settings. This action cannot be undone.',
                    () => {
                        localStorage.clear();
                        showSnackbar('All data cleared. Reloading...');
                        setTimeout(() => location.reload(), 1000);
                    }
                );
            }
        });

        // Handle speed mode toggle
        DOM.modalContent.addEventListener('change', (e) => {
            if (e.target.matches('#unlimited-mode-toggle')) {
                if (state.moves > 0 && !state.gameOver) {
                    e.target.checked = !e.target.checked; // Revert visual state
                    showConfirmationModal(
                        'Switch Mode?',
                        'Your progress on this puzzle will be lost.',
                        () => {
                            const mode = e.target.checked ? 'unlimited' : 'turns';
                            localStorage.setItem('keyhunt-mode', mode);
                            closeModal();
                            initGame(state.puzzle.date);
                        }
                    );
                    return;
                }
                const mode = e.target.checked ? 'unlimited' : 'turns';
                localStorage.setItem('keyhunt-mode', mode);
                initGame(state.puzzle.date);
            }

            if (e.target.matches('#timed-mode-toggle')) {
                if (state.moves > 0 && !state.gameOver) {
                    e.target.checked = !e.target.checked; // Revert visual state
                    showConfirmationModal(
                        'Switch Timed Mode?',
                        'Your progress on this puzzle will be lost.',
                        () => {
                            const isTimedMode = e.target.checked;
                            localStorage.setItem('keyhunt-timed-mode', isTimedMode.toString());
                            closeModal();
                            initGame(state.puzzle.date);
                        }
                    );
                    return;
                }
                const isTimedMode = e.target.checked;
                localStorage.setItem('keyhunt-timed-mode', isTimedMode.toString());
                initGame(state.puzzle.date);
            }
        });

        DOM.shareBtn.addEventListener('click', handleShare);
        
        // Close dropdown if clicking outside
        document.addEventListener('click', (e) => {
            if (!DOM.menuBtn.contains(e.target) && !DOM.menuDropdown.contains(e.target)) {
                DOM.menuDropdown.classList.add('hidden');
            }
        });

        const CURRENT_GAME_VERSION = '2.0';

        function checkGameVersion() {
            const storedVersion = localStorage.getItem('keyhunt-game-version');
            const hasGameProgress = hasGameProgressOrTutorialComplete();
            
            if (!hasGameProgress) {
                // No game progress or tutorial completion - show tutorial for new players
                showNewPlayerExperience();
            } else if (storedVersion && isVersionOlder(storedVersion, CURRENT_GAME_VERSION)) {
                // Has game progress AND has older version - show update notification
                showUpdateNotification(storedVersion);
            } else {
                // Version is current or first time setting version for existing player - normal game start
                console.log(`Game version ${CURRENT_GAME_VERSION} - ${storedVersion ? 'up to date' : 'first time version tracking'}`);
            }
            
            // Always update to current version after checking
            localStorage.setItem('keyhunt-game-version', CURRENT_GAME_VERSION);
        }

        function hasGameProgressOrTutorialComplete() {
            // Check if user has any actual game progress OR has completed tutorial
            const turnsScores = JSON.parse(localStorage.getItem('keyhunt-scores-turns') || '{}');
            const speedScores = JSON.parse(localStorage.getItem('keyhunt-scores-speed') || '{}');
            const tutorialCompleted = localStorage.getItem('khTut');
            
            // Only count as having progress if they have scores OR completed tutorial
            // playerId alone doesn't count since it's auto-generated
            return Object.keys(turnsScores).length > 0 || 
                   Object.keys(speedScores).length > 0 || 
                   tutorialCompleted === 'true';
        }

        function isVersionOlder(stored, current) {
            // Simple version comparison (works for X.Y format)
            const [storedMajor, storedMinor] = stored.split('.').map(Number);
            const [currentMajor, currentMinor] = current.split('.').map(Number);
            
            if (storedMajor < currentMajor) return true;
            if (storedMajor > currentMajor) return false;
            return storedMinor < currentMinor;
        }

        function showNewPlayerExperience() {
            // Show tutorial suggestion for completely new players
            setTimeout(() => {
                openModal('Welcome to KeyHunter!', `
                    <div class="text-center">
                        <p class="text-gray-300 mb-4">New to KeyHunter? Try our interactive tutorial to learn how to play!</p>
                        <div class="space-y-2">
                            <button onclick="closeModal(); startTutorial()" class="arcade-button pixel-border arcade-button-cyan w-full">Start Tutorial</button>
                            <button onclick="closeModal()" class="arcade-button pixel-border arcade-button-grey w-full">Skip for Now</button>
                        </div>
                    </div>
                `);
            }, 800);
        }

        function showUpdateNotification(previousVersion) {
            const versionUpdates = {
                '2.0': {
                    title: 'KeyHunter 2.0 Update!',
                    features: [
                        '🎮 Refreshed UI with retro arcade look',
                        '🎯 Three game modes: Turn, Timed, and Unlimited',
                        '🎨 Enhanced winning animations',
                        '📊 Track your streaks in Profile & Stats'
                    ],
                    highlight: 'Experience the new game modes in Settings!'
                }
                // future versions
            };
            
            const updateInfo = versionUpdates[CURRENT_GAME_VERSION];
            
            if (updateInfo) {
                setTimeout(() => {
                    openModal(updateInfo.title, `
                        <div class="text-center">
                            
                            <div class="text-left mb-4 space-y-2">
                                ${updateInfo.features.map(feature => 
                                    `<div class="text-sm text-gray-300">${feature}</div>`
                                ).join('')}
                            </div>
                            
                            <div class="bg-cyan-900 border-2 border-cyan-500 p-3 mb-4">
                                <p class="text-cyan-200 text-sm">${updateInfo.highlight}</p>
                            </div>
                            
                            ${previousVersion ? 
                                `<p class="text-xs text-gray-500 mb-4">Updated from v${previousVersion} to v${CURRENT_GAME_VERSION}</p>` : 
                                `<p class="text-xs text-gray-500 mb-4">Welcome to v${CURRENT_GAME_VERSION}!</p>`
                            }
                            
                            <div class="space-y-2">
                                <button onclick="closeModal(); openSettings()" class="arcade-button pixel-border arcade-button-cyan w-full">View New Modes</button>
                                <button onclick="closeModal()" class="arcade-button pixel-border arcade-button-grey w-full">Dismiss</button>
                            </div>
                        </div>
                    `);
                }, 500);
            }
        }

        // Helper function to open settings from update notification
        window.openSettings = function() {
            // Trigger the settings button click
            closeModal();
                
            // Wait a moment for modal to close, then trigger settings
            setTimeout(() => {
                // Trigger the settings button click event
                DOM.settingsBtn.click();
            }, 200);
        }

        // Version-specific migration functions
        function runVersionMigrations(fromVersion) {
            if (!fromVersion || isVersionOlder(fromVersion, '2.0')) {
                // Migrate to 2.0 - ensure speed mode data is in new format
                migrateSpeedModeData();
                console.log('Migrated data for v2.0');
            }
            // Add future migration logic here for newer versions
        }

        // Call this during game initialization
        function initializeGameVersion() {
            const storedVersion = localStorage.getItem('keyhunt-game-version');
            
            // Run any necessary migrations
            runVersionMigrations(storedVersion);
            
            // Check version and show appropriate UI
            checkGameVersion();
        }

        ensurePlayerId();
        initializeGameVersion(); // This handles both tutorial and update notifications
        initGame(); // Load today's puzzle on start
    </script>
    </div>
</body>
</html>
