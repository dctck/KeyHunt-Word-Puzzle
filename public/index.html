                    return;
                }

                if (state.moves > 0 && !state.gameOver) {
                    confirmForfeit();
                    return;
                }

                targetPuzzleNum = currentPuzzleNum + 1;
            }
            
            if (targetPuzzleNum) {
                
                try {
                    const response = await fetch('/api/archives');
                    const puzzles = await response.json();
                    const targetPuzzle = puzzles.find(p => p.puzzleNumber === targetPuzzleNum);
                    
                    if (targetPuzzle) {
                        transitionToPuzzle(targetPuzzle.date);
                    } else {
                        showSnackbar('Puzzle not found');
                    }
                } catch (error) {
                    showSnackbar('Error loading puzzle');
                }
            }
        });

        document.addEventListener('wheel', e => {
            if (!e.target.closest('#modal-content, #menu-dropdown')) {
                document.getElementById('game-container').scrollTop += e.deltaY;
                e.preventDefault();
            }
        }, {passive: false});

        DOM.tryAgainBtn.addEventListener('click', () => {
            if (!state.isToday) {
                // Reset to fresh game
                setupGame(state.puzzle, {
                    isToday: false,
                    gameState: 'fresh'
                });
            }
        });

        DOM.keyboard.addEventListener('click', (e) => handleVirtualKeyboard(e.target.closest('.key')?.dataset.key));
        document.addEventListener('keydown', handlePhysicalKeyboard);

        // Generic modal close
        DOM.modalClose.addEventListener('click', closeModal);

        DOM.helpBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/instructions');
                const data = await response.json();
                const content = data.steps.map(step => `<p class="text-gray-300 mb-3">${step}</p>`).join('');
                openModal('How to Play', content);
            } catch(e) {
                openModal('How to Play', '<p class="text-gray-300">Could not load instructions.</p>');
            }
        });

        function confirmForfeit(onComplete) {
            showConfirmationModal(
                'Forfeit Current Puzzle?',
                'Your progress will be lost and the puzzle will reset.',
                async () => {
                    // User CONFIRMED - reset game
                    if (state.puzzle && state.puzzle.date) {
                        await transitionToPuzzle(state.puzzle.date);
                    } else {
                        await transitionToPuzzle();
                    }
                    // Call the callback if provided
                    if (onComplete) onComplete();
                }
            );
        }

        DOM.menuBtn.addEventListener('click', () => {
            if (tutorial.active) {
                showConfirmationModal(
                    'Exit Tutorial?',
                    'Your tutorial progress will be lost.',
                    () => {
                        endTutorial();
                        initGame(); // Load today's puzzle
                    }
                );
            } else if (state.moves > 0 && !state.gameOver) {
                /*pause timer*/
                confirmForfeit(() => {
                    // This only runs when called from menu button
                    setTimeout(() => {
                        DOM.menuDropdown.classList.remove('hidden');
                    }, 100);
                });
            } else {
                DOM.menuDropdown.classList.toggle('hidden');
            }
        });


        DOM.todayBtn.addEventListener('click', (e) => {
            e.preventDefault();
            transitionToPuzzle();
            DOM.menuDropdown.classList.add('hidden');
        });

        DOM.settingsBtn.addEventListener('click', () => {
            closeModal();

            const turnsScores = JSON.parse(localStorage.getItem('keyhunt-scores-turns') || '{}');
            const speedScores = JSON.parse(localStorage.getItem('keyhunt-scores-speed') || '{}');
            const turnsHistory = JSON.parse(localStorage.getItem('keyhunt-history-turns') || '{}');
            const speedHistory = JSON.parse(localStorage.getItem('keyhunt-history-speed') || '{}');
            
            const turnsPuzzleCount = Object.keys(turnsScores).length;
            const speedPuzzleCount = Object.keys(speedScores).length;
            const turnsHistoryCount = Object.keys(turnsHistory).length;
            const speedHistoryCount = Object.keys(speedHistory).length;

            const settingsContent = `
                <div class="flex items-center justify-between py-2 mb-4">
                    <div>
                        <span class="text-gray-300">Speed Mode</span>
                        <p class="text-xs text-gray-500 mr-2">Finish as fast as possible. No turn limit.</p>
                    </div>
                    <label for="speed-mode-toggle" class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="speed-mode-toggle" class="sr-only" ${localStorage.getItem('keyhunt-mode') === 'speed' ? 'checked' : ''}>
                            <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                        </div>
                    </label>
                </div>
                
                <div class="border-t border-gray-700 mt-4 pt-4">
                    <span class="text-gray-300">Progress Backup</span>
                    <p class="text-xs text-gray-500 mb-3">Export your progress or import from another device</p>

                    <!-- Export Summary -->
                    <div class="bg-gray-700 rounded-md p-3 mb-3 text-xs">
                        <div class="text-gray-300 font-semibold mb-1">Your Progress:</div>
                        <div class="text-gray-400 space-y-1">
                            <div>• Turns Mode: ${turnsPuzzleCount} puzzles completed${turnsHistoryCount > 0 ? ` (${turnsHistoryCount} with history)` : ''}</div>
                            <div>• Speed Mode: ${speedPuzzleCount} puzzles completed${speedHistoryCount > 0 ? ` (${speedHistoryCount} with history)` : ''}</div>
                            <div class="text-cyan-400 mt-2">✓ Includes all scores and daily puzzle history</div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <button id="export-code-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition text-sm">
                            Backup Data
                        </button>
                        <div class="flex flex-col gap-2">
                            <input id="import-code-input" type="text" placeholder="Enter progress code (v1 or v2 format)" 
                                   class="w-full bg-gray-700 text-white px-3 py-2 rounded-md border border-gray-600 focus:border-blue-500 focus:outline-none text-xs">
                            <button id="import-code-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition text-sm">
                                Import Backup
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">⚠️ Importing will overwrite your current progress</p>
                    </div>
                </div>
                
                <div class="border-t border-gray-700 mt-4 pt-4">
                    <button id="clear-data-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition text-sm">Clear All Game Data</button>
                </div>
            `;
            
            openModal('Settings', settingsContent);
        
        });
        
        DOM.cancelConfirmationBtn.addEventListener('click', () => closeModal(DOM.confirmationModal));

        window.handleArchivesClick = async function () {

            showLoader();
            await new Promise(resolve => setTimeout(resolve, 500));
            hideLoader();

            try {
                const response = await fetch('/api/archives');
                const puzzles = await response.json();
                const savedScores = getSavedScores();
                
                // Get today's puzzle number to filter archives
                const todayResponse = await fetch('/api/puzzle');
                const todayPuzzle = await todayResponse.json();
                const todayPuzzleNumber = todayPuzzle.puzzleNumber;
                
                // Filter to show only puzzles with numbers smaller than today's
                const archivePuzzles = puzzles.filter(p => p.puzzleNumber < todayPuzzleNumber);

                const content = `<div class="space-y-2 max-h-64 overflow-y-auto">
                    ${archivePuzzles.map(p => {
                        const score = savedScores[p.puzzleNumber] || 'New';
                        return `
                            <button data-date="${p.date}" class="archive-date-btn block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 rounded-md flex justify-between items-center">
                                <span>#${p.puzzleNumber} - ${p.date}</span>
                                <span class="font-bold">${score}</span>
                            </button>
                        `;
                    }).join('')}
                </div>`;

                openModal('Archives', content);
            } catch (error) {
                openModal('Archives', '<p class="text-gray-300">Could not load archives.</p>');
            }
            DOM.menuDropdown.classList.add('hidden');
        }

        DOM.archivesCtaBtn.addEventListener('click', handleArchivesClick);
        DOM.archivesBtn.addEventListener('click', handleArchivesClick);

        DOM.modalContent.addEventListener('click', (e) => {

           // Star rating
           if (e.target.dataset.rating) {
               const rating = +e.target.dataset.rating;
               const stars = document.querySelectorAll('#stars button');
               stars.forEach((s, i) => {
                       if (i < rating) {
                           s.textContent = '★';
                           s.style.color = '#fbbf24';
                           s.setAttribute('data-selected', 'true'); 
                       } else {
                           s.textContent = '☆';
                           s.style.color = '#6b7280';
                           s.removeAttribute('data-selected'); 
                       }
                   });
               const ratingLabels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
               document.getElementById('rating-text').textContent = ratingLabels[rating] || 'Click to rate';

               const starsContainer = document.getElementById('stars');
               starsContainer.setAttribute('data-current-rating', rating);
           }
           
           // Send feedback
           if (e.target.id === 'send-feedback') {
               const message = document.getElementById('feedback-message').value.trim();
               if (!message) return showSnackbar('Please enter a message');
               
               const feedbackType = document.getElementById('feedback-type').value;
               const starsContainer = document.getElementById('stars');
               const rating = starsContainer ? starsContainer.getAttribute('data-current-rating') : null;

               const typeMap = {
                       'bug': 'Bug Report',
                       'feature': 'Feature Request', 
                       'general': 'General Feedback',
                       'praise': 'Compliment',
                       'difficulty': 'Puzzle Difficulty'
               };
               
               // Submit to Google Form (replace YOUR_FORM_ID with actual form ID)
               const formData = new FormData();
               formData.append('entry.873680804', typeMap[feedbackType] || 'General Feedback');  // Use mapped value!
               formData.append('entry.746742452', message);       
               formData.append('entry.1364770418', rating || ''); // Send empty string instead of '0'
               formData.append('entry.1029212732', state.puzzle?.puzzleNumber || 0);
               formData.append('entry.1198672043', new Date().toISOString());
               formData.append('entry.1223482797', localStorage.getItem('keyhunt-playerId') || 'unknown');

               console.log('Sending to Google Form:', {
                   type: typeMap[feedbackType],
                   message: message,
                   rating: rating || 'no rating',
                   puzzle: state.puzzle?.puzzleNumber || 0
               });
               
               // Submit to Google Form
               fetch('https://docs.google.com/forms/d/e/1FAIpQLSfDhfl8cLZp5ZEv30uxTMDu-PQl2cwJw7ZmaLHRkB7q3049fA/formResponse', {
                   method: 'POST',
                   mode: 'no-cors',
                   body: formData
               }).then(() => {
               }).catch(err => {
               });
               
               // Also send to GA for backup
               if (typeof trackEvent === 'function') {
                    trackEvent('feedback_submitted', {
                        feedback_type: feedbackType,
                        rating: rating || '0'
                    });
                }
               
               showSnackbar('Thank you! Feedback sent 🎉');
               closeModal();
           }

            // Handle archive puzzle clicks
            if (e.target.matches('.archive-date-btn')) {
                const date = e.target.dataset.date;
                transitionToPuzzle(date);
                closeModal();
            }

            if (e.target.id === 'copy-player-id') {
                    const playerId = localStorage.getItem('keyhunt-playerId');
                    const textarea = document.createElement('textarea');
                    textarea.value = playerId;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showSnackbar('Player ID copied to clipboard!');
                        e.target.textContent = 'Copied!';
                        setTimeout(() => {
                            e.target.textContent = 'Copy';
                        }, 2000);
                    } catch (err) {
                        showSnackbar('Failed to copy Player ID!');
                    }
                    document.body.removeChild(textarea);
                }

            // Handle export button
            if (e.target.matches('#export-code-btn')) {
                try {
                    const code = generateProgressCode();
                    navigator.clipboard.writeText(code).then(() => {
                        showSnackbar('Complete progress exported to clipboard!');
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = code;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        showSnackbar('Complete progress exported!');
                    });
                } catch (error) {
                    console.error('Export error:', error);
                    showSnackbar('Export failed. Please try again.');
                }
            }
            
            // Handle import button with enhanced feedback
            if (e.target.matches('#import-code-btn')) {
                const code = document.getElementById('import-code-input').value.trim();
                if (!code) {
                    showSnackbar('Please enter a progress code');
                    return;
                }
                
                try {
                    importProgressCode(code);
                    showSnackbar('Progress imported successfully! Reloading...');
                    document.getElementById('import-code-input').value = '';
                    
                    // Give user time to see the success message before reloading
                    setTimeout(() => {
                        closeModal();
                        if (state.puzzle) {
                            const currentDate = state.puzzle.date;
                            initGame(currentDate);
                        } else {
                            location.reload();
                        }
                    }, 1500);
                    
                } catch (error) {
                    console.error('Import error:', error);
                    showSnackbar('Invalid or corrupted progress code');
                }
            }
        
            // Handle clear data button
            if (e.target.matches('#clear-data-btn')) {
                closeModal();
                showConfirmationModal(
                    'Clear All Data?',
                    'This will reset all your scores, history, and settings. This action cannot be undone.',
                    () => {
                        localStorage.clear();
                        showSnackbar('All data cleared. Reloading...');
                        setTimeout(() => location.reload(), 1000);
                    }
                );
            }
        });

        // Handle speed mode toggle
        DOM.modalContent.addEventListener('change', (e) => {
            if (e.target.matches('#speed-mode-toggle')) {
                if (state.moves > 0 && !state.gameOver) {
                    e.target.checked = !e.target.checked; // Revert visual state
                    showConfirmationModal(
                        'Switch Mode?',
                        'Your progress on this puzzle will be lost.',
                        () => {
                            const mode = e.target.checked ? 'speed' : 'turns';
                            localStorage.setItem('keyhunt-mode', mode);
                            closeModal();
                            initGame(state.puzzle.date);
                        }
                    );
                    return;
                }
                const mode = e.target.checked ? 'speed' : 'turns';
                localStorage.setItem('keyhunt-mode', mode);
                initGame(state.puzzle.date);
            }
        });

        DOM.shareBtn.addEventListener('click', handleShare);
        DOM.playNextBtn.addEventListener('click', async () => {
            const response = await fetch('/api/archives');
            const puzzles = await response.json();
            const currentIndex = puzzles.findIndex(p => p.date === state.puzzle.date);
            if (currentIndex > 0) {
                initGame(puzzles[currentIndex - 1].date);
            }
        });
        
        // Close dropdown if clicking outside
        document.addEventListener('click', (e) => {
            if (!DOM.menuBtn.contains(e.target) && !DOM.menuDropdown.contains(e.target)) {
                DOM.menuDropdown.classList.add('hidden');
            }
        });

        ensurePlayerId();
        initGame(); // Load today's puzzle on start

        if (!localStorage.getItem('khTut') && !localStorage.getItem('keyhunt-scores-turns')) {
            setTimeout(() => {
                openModal('Welcome to KeyHunter!', `
                    <div class="text-center">
                        <p class="text-gray-300 mb-4">New to KeyHunter? Try our interactive tutorial to learn how to play!</p>
                        <div class="space-y-2">
                            <button onclick="closeModal(); startTutorial()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Start Tutorial</button>
                            <button onclick="closeModal()" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">Skip for Now</button>
                        </div>
                    </div>
                `);
            }, 800);
        }
    </script>
    </div>
</body>
</html>
